[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verto"
version = "0.1.0"
description = "Verto — offline desktop file converter powered by Morphix"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Verto contributors" }]
dependencies = [
    "PySide6>=6.6",
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    "img2pdf>=0.5",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
verto = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
